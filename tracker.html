<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>トラッカー - ACTMATE</title>
<style>
  :root {
    --red:#FF4655; --red-light:#fff0f2; --text:#111; --muted:#888;
    --border:#f0e0e2; --card-shadow:0 2px 16px rgba(255,70,85,0.08);
    --off-white:#fafafa; --green:#22c55e; --yellow:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--off-white);color:var(--text);max-width:430px;margin:0 auto;min-height:100vh;}

  /* ヘッダー */
  .header{background:var(--red);padding:48px 20px 0;position:relative;overflow:hidden;}
  .header::after{content:'';position:absolute;top:-40px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.05);}
  .header-label{font-size:10px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,0.5);text-transform:uppercase;margin-bottom:4px;}

  /* 検索 */
  .search-area{background:white;border-bottom:1.5px solid var(--border);padding:12px 16px;}
  .search-row{display:flex;gap:8px;}
  .search-input{flex:1;border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;font-size:15px;font-family:inherit;outline:none;transition:border-color 0.15s;}
  .search-input:focus{border-color:var(--red);}
  .region-select{border:1.5px solid var(--border);border-radius:12px;padding:11px 10px;font-size:13px;font-family:inherit;outline:none;background:white;cursor:pointer;}
  .search-btn{background:var(--red);color:white;border:none;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;transition:opacity 0.15s;}
  .search-btn:active{opacity:0.85;}
  .search-hint{font-size:11px;color:var(--muted);margin-top:6px;}

  /* プロフィールミニ */
  .profile-mini{display:none;align-items:center;gap:12px;padding-bottom:16px;}
  .profile-mini.visible{display:flex;}
  .rank-icon{font-size:28px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.12);border-radius:13px;flex-shrink:0;}
  .rank-icon img{width:36px;height:36px;object-fit:contain;}
  .profile-mini-name{font-size:17px;font-weight:900;color:white;}
  .profile-mini-rank{font-size:12px;color:rgba(255,255,255,0.7);margin-top:1px;}
  .profile-mini-rr{font-size:11px;color:rgba(255,255,255,0.5);}

  /* タブバー */
  .tab-bar{display:none;background:rgba(0,0,0,0.15);}
  .tab-bar.visible{display:flex;}
  .tab-btn{flex:1;padding:11px 0;font-size:12px;font-weight:700;color:rgba(255,255,255,0.55);background:none;border:none;cursor:pointer;position:relative;transition:color 0.15s;font-family:inherit;}
  .tab-btn.active{color:white;}
  .tab-btn.active::after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:2.5px;background:white;border-radius:2px 2px 0 0;}

  /* 状態 */
  .tab-panel{display:none;padding:14px 14px 110px;}
  .tab-panel.active{display:block;}
  .empty-state{text-align:center;padding:60px 20px;}
  .empty-state svg{width:50px;height:50px;color:#ddd;margin-bottom:14px;}
  .empty-state h3{font-size:16px;font-weight:800;margin-bottom:6px;}
  .empty-state p{font-size:13px;color:var(--muted);line-height:1.7;}
  .loading{text-align:center;padding:50px 20px;}
  .spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{font-size:13px;color:var(--muted);}
  .error-box{background:#fff5f5;border:1.5px solid #ffd0d0;border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;}
  .error-box svg{width:18px;height:18px;color:var(--red);flex-shrink:0;}
  .error-box p{font-size:13px;color:var(--red);line-height:1.5;}

  /* カード */
  .card{background:white;border:1.5px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:10px;box-shadow:var(--card-shadow);}
  .card-title{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;}

  /* スタッツ */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .stat-card{background:white;border:1.5px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--card-shadow);}
  .stat-label{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:5px;}
  .stat-value{font-size:26px;font-weight:900;line-height:1;}
  .stat-unit{font-size:13px;font-weight:600;color:var(--muted);}
  .stat-bar{height:3px;background:var(--border);border-radius:100px;margin-top:8px;overflow:hidden;}
  .stat-bar-fill{height:100%;border-radius:100px;}

  /* 試合 */
  .match-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .match-item:last-child{border-bottom:none;padding-bottom:0;}
  .match-result{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;}
  .match-result.win{background:rgba(34,197,94,0.1);color:var(--green);}
  .match-result.loss{background:rgba(255,70,85,0.1);color:var(--red);}
  .match-body{flex:1;}
  .match-agent{font-size:13px;font-weight:700;}
  .match-map{font-size:11px;color:var(--muted);}
  .match-kda{font-size:13px;font-weight:700;}
  .match-acs{font-size:11px;color:var(--muted);text-align:right;}

  /* AI診断 */
  .diag-score-wrap{background:#f8f8f8;border-radius:14px;padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:10px;}
  .diag-score-circle{width:64px;height:64px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;}
  .diag-score-circle svg{position:absolute;top:0;left:0;width:64px;height:64px;transform:rotate(-90deg);}
  .diag-score-num{font-size:20px;font-weight:900;position:relative;z-index:1;}
  .diag-score-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;font-weight:700;}
  .diag-score-label{font-size:14px;font-weight:800;}
  .diag-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
  .diag-item:last-child{border-bottom:none;padding-bottom:0;}
  .diag-sev{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .diag-sev.bad{background:rgba(255,70,85,0.1);}
  .diag-sev.warn{background:rgba(245,158,11,0.1);}
  .diag-sev.good{background:rgba(34,197,94,0.1);}
  .diag-content{flex:1;}
  .diag-row{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
  .diag-key{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
  .diag-val{font-size:13px;font-weight:900;}
  .diag-val.bad{color:var(--red);}
  .diag-val.warn{color:var(--yellow);}
  .diag-val.good{color:var(--green);}
  .diag-text{font-size:12px;line-height:1.55;margin-bottom:6px;}
  .diag-text strong{color:var(--red);font-weight:800;background:rgba(255,70,85,0.08);padding:0 3px;border-radius:4px;}
  .diag-text strong.ok{color:var(--green);background:rgba(34,197,94,0.08);}
  .diag-text strong.warn{color:var(--yellow);background:rgba(245,158,11,0.08);}
  .diag-btn{display:inline-flex;align-items:center;gap:4px;background:var(--red-light);border:1px solid #ffd0d5;border-radius:100px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--red);text-decoration:none;}
  .diag-ok{font-size:12px;color:var(--green);font-weight:600;}
  .bench-bar{display:flex;align-items:center;gap:6px;margin:5px 0 6px;}
  .bench-bar-track{flex:1;height:4px;background:#eee;border-radius:100px;overflow:visible;position:relative;}
  .bench-bar-fill{height:100%;border-radius:100px;}

  /* ポジション */
  .pos-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
  .pos-num-card{background:white;border:1.5px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;box-shadow:var(--card-shadow);}
  .pos-num{font-size:24px;font-weight:900;line-height:1;margin-bottom:3px;}
  .pos-num.danger{color:var(--red);}
  .pos-num.warn{color:var(--yellow);}
  .pos-num.ok{color:var(--green);}
  .pos-num-label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
  .map-tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none;}
  .map-tabs::-webkit-scrollbar{display:none;}
  .map-tab{flex-shrink:0;font-size:11px;font-weight:700;padding:5px 14px;border-radius:100px;cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--muted);transition:all 0.15s;font-family:inherit;}
  .map-tab.active{background:var(--red);color:white;border-color:var(--red);}

  /* 攻守トグル */
  .phase-toggle{display:flex;gap:0;margin-bottom:10px;background:#f0f0f0;border-radius:100px;padding:3px;}
  .phase-btn{flex:1;padding:6px 0;font-size:11px;font-weight:700;border:none;border-radius:100px;cursor:pointer;font-family:inherit;background:none;color:var(--muted);transition:all 0.18s;}
  .phase-btn.active{background:white;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.12);}
  .phase-btn.active.attack{color:#FF4655;}
  .phase-btn.active.defense{color:#3b82f6;}

  .heatmap-wrap{position:relative;background:#1a1a2e;border-radius:14px;overflow:hidden;margin-bottom:10px;}
  .heatmap-wrap canvas{display:block;width:100%;height:auto;}
  .heatmap-phase-label{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;padding:3px 10px;border-radius:100px;letter-spacing:0.5px;}
  .heatmap-phase-label.all{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.7);}
  .heatmap-phase-label.attack{background:rgba(255,70,85,0.25);color:#FF4655;}
  .heatmap-phase-label.defense{background:rgba(59,130,246,0.25);color:#60a5fa;}
  .heatmap-legend{position:absolute;bottom:8px;right:8px;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,0.65);border-radius:100px;padding:4px 10px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;}
  .legend-label{font-size:9px;color:rgba(255,255,255,0.7);font-weight:600;}
  .pos-insight{display:flex;gap:10px;padding:11px 12px;border-radius:12px;margin-bottom:8px;align-items:flex-start;}
  .pos-insight:last-child{margin-bottom:0;}
  .pos-insight.red{background:rgba(255,70,85,0.07);}
  .pos-insight.yellow{background:rgba(245,158,11,0.07);}
  .pos-insight.green{background:rgba(34,197,94,0.07);}
  .pos-insight-icon{font-size:17px;flex-shrink:0;margin-top:1px;}
  .pos-insight-title{font-size:12px;font-weight:700;margin-bottom:2px;}
  .pos-insight-desc{font-size:11px;color:var(--muted);line-height:1.5;}
  .pos-note{font-size:10px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6;}

  .tracker-link{display:flex;align-items:center;gap:10px;background:white;border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--text);font-weight:700;font-size:14px;box-shadow:var(--card-shadow);}

  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:white;border-top:1.5px solid var(--border);display:flex;padding:8px 0 22px;z-index:100;}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 0;}
  .nav-icon svg{width:22px;height:22px;color:var(--muted);}
  .nav-label{font-size:10px;font-weight:600;color:var(--muted);}
  .nav-item.active .nav-label{color:var(--red);}
  .nav-item.active .nav-icon svg{color:var(--red);}
</style>
</head>
<body>

<!-- ヘッダー（未検索） -->
<div class="header" id="header-search">
  <div class="header-label">ACTMATE / トラッカー</div>
  <div style="font-size:26px;font-weight:900;color:white;margin-bottom:16px">スタッツ検索</div>
</div>

<!-- ヘッダー（検索後） -->
<div class="header" id="header-result" style="display:none">
  <div class="header-label">ACTMATE / トラッカー</div>
  <div class="profile-mini" id="profile-mini">
    <div class="rank-icon" id="header-rank-icon">🎯</div>
    <div>
      <div class="profile-mini-name" id="header-name">---</div>
      <div class="profile-mini-rank" id="header-rank">---</div>
      <div class="profile-mini-rr" id="header-rr">--- RR</div>
    </div>
  </div>
  <div class="tab-bar visible">
    <button class="tab-btn active" onclick="switchTab('stats',this)">スタッツ</button>
    <button class="tab-btn" onclick="switchTab('diag',this)">🧠 AI診断</button>
    <button class="tab-btn" onclick="switchTab('pos',this)">📍 ポジション</button>
  </div>
</div>

<!-- 検索フォーム -->
<div class="search-area" id="search-area">
  <div class="search-row">
    <input class="search-input" id="riot-input" type="text" placeholder="RiotID#JP1" autocomplete="off" onkeydown="if(event.key==='Enter')doSearch()">
    <select class="region-select" id="region-select">
      <option value="ap">AP</option>
      <option value="na">NA</option>
      <option value="eu">EU</option>
      <option value="kr">KR</option>
    </select>
    <button class="search-btn" onclick="doSearch()">検索</button>
  </div>
  <div class="search-hint">例: PlayerName#JP1</div>
</div>

<!-- 空状態 -->
<div id="state-empty" style="padding:14px 14px 110px">
  <div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
    <h3>Riot IDを入力してください</h3>
    <p>名前とタグ（#以降）を入力して<br>スタッツと弱点診断を確認できます</p>
  </div>
</div>

<!-- ローディング -->
<div id="state-loading" style="display:none;padding:14px 14px 110px">
  <div class="loading"><div class="spinner"></div><p>データを取得中...</p></div>
</div>

<!-- エラー -->
<div id="state-error" style="display:none;padding:14px 14px 110px">
  <div class="error-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <p id="error-msg"></p>
  </div>
</div>

<!-- タブ①：スタッツ -->
<div class="tab-panel" id="panel-stats">
  <div class="stats-grid" id="stats-grid"></div>
  <div class="card" id="matches-card"></div>
  <a id="tracker-link" href="#" target="_blank" class="tracker-link">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF4655" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    <div>tracker.gg で詳細を見る<div style="font-size:11px;color:var(--muted);font-weight:400">全スタッツ・エージェント・マップ別</div></div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;color:var(--muted)"><path d="M9 18l6-6-6-6"/></svg>
  </a>
</div>

<!-- タブ②：AI診断 -->
<div class="tab-panel" id="panel-diag">
  <div id="diag-score-area"></div>
  <div class="card" id="diag-items-card"></div>
</div>

<!-- タブ③：ポジション分析 -->
<div class="tab-panel" id="panel-pos">
  <div id="pos-loading" style="text-align:center;padding:40px 0;color:var(--muted);font-size:13px">⏳ 詳細データを取得中...</div>
  <div id="pos-content" style="display:none">
    <div id="pos-overview"></div>
    <div id="pos-map-cards"></div>
    <p id="pos-note" style="font-size:10px;color:var(--muted);text-align:center;margin-top:8px;display:none">※ 直近5試合の座標データを分析</p>
  </div>
</div>

<!-- マップ詳細スライドパネル -->
<div id="detail-panel" style="position:fixed;top:0;left:50%;transform:translateX(calc(-50% + 200vw));width:100%;max-width:430px;height:100%;background:var(--off-white);z-index:200;overflow-y:auto;transition:transform 0.3s ease;padding-bottom:40px">
  <div style="background:var(--red);padding:48px 20px 16px;position:sticky;top:0;z-index:10">
    <button onclick="closeDetail()" style="background:rgba(255,255,255,0.2);border:none;color:white;border-radius:100px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px">← 戻る</button>
    <div id="detail-title" style="font-size:20px;font-weight:900;color:white;margin-bottom:12px"></div>
    <div style="display:flex;background:rgba(0,0,0,0.15);border-radius:100px;padding:3px">
      <button class="detail-phase-btn active" onclick="switchDetailPhase('all',this)" style="flex:1;padding:7px 0;font-size:12px;font-weight:700;border:none;border-radius:100px;cursor:pointer;font-family:inherit;background:white;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.12)">すべて</button>
      <button class="detail-phase-btn" onclick="switchDetailPhase('attack',this)" style="flex:1;padding:7px 0;font-size:12px;font-weight:700;border:none;border-radius:100px;cursor:pointer;font-family:inherit;background:none;color:rgba(255,255,255,0.6)">⚔ 攻め</button>
      <button class="detail-phase-btn" onclick="switchDetailPhase('defense',this)" style="flex:1;padding:7px 0;font-size:12px;font-weight:700;border:none;border-radius:100px;cursor:pointer;font-family:inherit;background:none;color:rgba(255,255,255,0.6)">🛡 守り</button>
    </div>
  </div>
  <div style="padding:14px">
    <div id="detail-summary"></div>
    <div id="detail-rounds"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg></div><span class="nav-label">ホーム</span></a>
  <a class="nav-item" href="knowledge.html"><div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg></div><span class="nav-label">知識</span></a>
  <a class="nav-item active" href="tracker.html"><div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg></div><span class="nav-label">トラッカー</span></a>
  <a class="nav-item" href="routine.html"><div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="4" height="8" rx="1"/><rect x="18" y="8" width="4" height="8" rx="1"/><rect x="5" y="10" width="3" height="4" rx="0.5"/><rect x="16" y="10" width="3" height="4" rx="0.5"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div><span class="nav-label">ルーティン</span></a>
  <a class="nav-item" href="goal.html"><div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></div><span class="nav-label">目標</span></a>
</nav>

<script>
// ========== ランクベンチマーク ==========
const BENCHMARKS = {
  'Iron':      {hs:10,kd:0.75,acs:120,assists:1.0,label:'アイアン帯'},
  'Bronze':    {hs:13,kd:0.85,acs:145,assists:1.3,label:'ブロンズ帯'},
  'Silver':    {hs:15,kd:0.95,acs:165,assists:1.6,label:'シルバー帯'},
  'Gold':      {hs:17,kd:1.05,acs:185,assists:1.9,label:'ゴールド帯'},
  'Platinum':  {hs:19,kd:1.10,acs:205,assists:2.1,label:'プラチナ帯'},
  'Diamond':   {hs:22,kd:1.20,acs:230,assists:2.4,label:'ダイヤ帯'},
  'Ascendant': {hs:24,kd:1.30,acs:255,assists:2.7,label:'アセン帯'},
  'Immortal':  {hs:26,kd:1.40,acs:280,assists:3.0,label:'イモタル帯'},
  'Radiant':   {hs:30,kd:1.60,acs:320,assists:3.2,label:'レディアント帯'},
};
function getBench(rankStr) {
  for (const key of Object.keys(BENCHMARKS)) {
    if (rankStr && rankStr.startsWith(key)) return {key, ...BENCHMARKS[key]};
  }
  return {key:'Diamond', ...BENCHMARKS['Diamond']};
}
function getNextBench(currentKey) {
  const keys = Object.keys(BENCHMARKS);
  const idx = keys.indexOf(currentKey);
  return BENCHMARKS[keys[Math.min(idx+1, keys.length-1)]];
}

// ========== 状態管理 ==========
function setState(state, msg) {
  ['state-empty','state-loading','state-error'].forEach(id => document.getElementById(id).style.display='none');
  if (state !== 'result') document.getElementById(`state-${state}`).style.display='block';
  if (msg) document.getElementById('error-msg').textContent=msg;
  const isResult = state==='result';
  document.getElementById('header-search').style.display = isResult?'none':'block';
  document.getElementById('header-result').style.display = isResult?'block':'none';
  ['stats','diag','pos'].forEach(t => {
    const p = document.getElementById(`panel-${t}`);
    p.style.display = '';  // インラインstyleをリセット、CSSクラスに委ねる
    p.classList.remove('active');
  });
  if (isResult) {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('.tab-btn').classList.add('active');
    document.getElementById('panel-stats').classList.add('active');
  }
}

// ========== API呼び出し（Vercel経由でキーを隠す） ==========
function henriApi(path, params = {}) {
  const qs = new URLSearchParams({ path, ...params }).toString();
  return fetch(`/api/henrik?${qs}`);
}

// ========== 検索 ==========
async function doSearch() {
  const raw = document.getElementById('riot-input').value.trim();
  const region = document.getElementById('region-select').value;
  if (!raw) return;
  const parts = raw.split('#');
  if (parts.length < 2) { setState('error','「名前#タグ」の形で入力してください。例: PlayerName#JP1'); return; }
  const [name, tag] = parts;
  localStorage.setItem('actmate_tracker_search', JSON.stringify({name:raw,region}));
  setState('loading');
  window._apiHeaders = {}; // Vercel経由なのでフロントにキー不要

  try {
    const [mmrRes, matchRes] = await Promise.all([
      henriApi(`valorant/v2/mmr/${region}/${encodeURIComponent(name)}/${encodeURIComponent(tag)}`),
      henriApi(`valorant/v3/matches/${region}/${encodeURIComponent(name)}/${encodeURIComponent(tag)}`, { mode: 'competitive', size: 10 })
    ]);
    if (!mmrRes.ok) throw new Error(`プレイヤーが見つかりません (${mmrRes.status})`);
    const mmrData  = await mmrRes.json();
    const matchData = matchRes.ok ? await matchRes.json() : null;
    renderAll(name, tag, mmrData, matchData);
  } catch(e) {
    setState('error', e.message || 'データ取得に失敗しました。');
  }
}

function findMe(match, name, tag) {
  // henrikdev v3 は 'all players'（スペース）か 'all_players'（アンダースコア）どちらも対応
  const list = match.players?.all_players || match.players?.['all players'] || [];
  return list.find(p =>
    p.name?.toLowerCase()===name.toLowerCase() && p.tag?.toLowerCase()===tag.toLowerCase()
  );
}

// ========== メイン描画 ==========
function renderAll(name, tag, mmrData, matchData) {
  const d = mmrData.data;
  const currentRank = d?.current_data?.currenttierpatched || 'Unranked';
  const currentRR   = d?.current_data?.ranking_in_tier ?? '--';
  const peakRank    = d?.highest_rank?.patched_tier || '';
  const rankFile    = RANK_TO_FILE[currentRank];
  const matches     = matchData?.data || [];

  let wins=0,losses=0,tKills=0,tDeaths=0,tAssists=0,tHS=0,tBody=0,tLeg=0,tACS=0,mc=0;
  matches.forEach(m => {
    const me=findMe(m,name,tag); if(!me) return; mc++;
    tKills+=me.stats?.kills||0; tDeaths+=me.stats?.deaths||0; tAssists+=me.stats?.assists||0;
    tHS+=me.stats?.headshots||0; tBody+=me.stats?.bodyshots||0; tLeg+=me.stats?.legshots||0;
    tACS+=me.stats?.score?Math.round(me.stats.score/(m.metadata?.rounds_played||1)):0;
    const myTeam=me.team?.toLowerCase();
    if(m.teams?.[myTeam]?.has_won) wins++; else losses++;
  });
  const kd     = tDeaths>0?(tKills/tDeaths).toFixed(2):'--';
  const hsTotal= tHS+tBody+tLeg;
  const hsPct  = hsTotal>0?Math.round((tHS/hsTotal)*100):0;
  const acs    = mc>0?Math.round(tACS/mc):0;
  const winPct = (wins+losses)>0?Math.round((wins/(wins+losses))*100):null;
  const avgAssists = mc>0?(tAssists/mc).toFixed(1):0;

  // ヘッダー
  document.getElementById('header-name').textContent=`${name} #${tag}`;
  document.getElementById('header-rank').textContent=currentRank+(peakRank?` · ピーク: ${peakRank}`:'');
  document.getElementById('header-rr').textContent=`${currentRR} RR`;
  if(rankFile) document.getElementById('header-rank-icon').innerHTML=`<img src="rank_icons/${rankFile}.png" width="36" height="36" style="object-fit:contain">`;

  // タブ①スタッツ
  const kdC  = parseFloat(kd)>=1.0?'var(--green)':parseFloat(kd)>=0.8?'var(--yellow)':'var(--red)';
  const hsC  = hsPct>=22?'var(--green)':hsPct>=15?'var(--yellow)':'var(--red)';
  const acsC = acs>=200?'var(--green)':acs>=150?'var(--yellow)':'var(--red)';
  const wC   = winPct!=null?(winPct>=50?'var(--green)':'var(--red)'):'var(--muted)';
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-card"><div class="stat-label">K/D</div><div class="stat-value" style="color:${kdC}">${kd}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.min(100,parseFloat(kd)*50)}%;background:${kdC}"></div></div></div>
    <div class="stat-card"><div class="stat-label">HS%</div><div class="stat-value" style="color:${hsC}">${hsPct}<span class="stat-unit">%</span></div><div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.min(100,hsPct*2.5)}%;background:${hsC}"></div></div></div>
    <div class="stat-card"><div class="stat-label">ACS</div><div class="stat-value" style="color:${acsC}">${acs||'--'}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.min(100,(acs/400)*100)}%;background:${acsC}"></div></div></div>
    <div class="stat-card"><div class="stat-label">WIN%</div><div class="stat-value" style="color:${wC}">${winPct??'--'}<span class="stat-unit">${winPct!=null?'%':''}</span></div><div class="stat-bar"><div class="stat-bar-fill" style="width:${winPct??0}%;background:${wC}"></div></div></div>`;
  const matchListHTML = matches.slice(0,5).map(m=>{
    const me=findMe(m,name,tag); if(!me) return '';
    const won=m.teams?.[me.team?.toLowerCase()]?.has_won;
    const k=me.stats?.kills||0,dd=me.stats?.deaths||0,a=me.stats?.assists||0;
    const acs2=Math.round((me.stats?.score||0)/(m.metadata?.rounds_played||1));
    const br=m.teams?.blue?.rounds_won??'--',rr=m.teams?.red?.rounds_won??'--';
    return `<div class="match-item"><div class="match-result ${won?'win':'loss'}">${won?'W':'L'}</div><div class="match-body"><div class="match-agent">${me.character||'--'}</div><div class="match-map">${m.metadata?.map||'--'} · ${br}:${rr}</div></div><div><div class="match-kda">${k}/${dd}/${a}</div><div class="match-acs">ACS ${acs2}</div></div></div>`;
  }).join('');
  document.getElementById('matches-card').innerHTML=matchListHTML?`<div class="card-title">直近5試合</div>${matchListHTML}`:'<p style="text-align:center;color:var(--muted);font-size:13px">試合データがありません</p>';
  document.getElementById('tracker-link').href=`https://tracker.gg/valorant/profile/riot/${encodeURIComponent(name)}%23${encodeURIComponent(tag)}/overview`;

  // タブ②AI診断（動的ベンチマーク付き）
  buildDiagTab(hsPct, parseFloat(kd), acs, parseFloat(avgAssists), mc, currentRank);

  // タブ③ポジション：ローディング表示のまま非同期で取得
  _posData = {};
  setState('result');

  // 直近5試合の詳細データを非同期で取得して座標を描画
  fetchMatchDetails(matches, name, tag, window._apiHeaders);
}

// ========== AI診断（ベンチマーク連動） ==========
function buildDiagTab(hsPct, kd, acs, avgAssists, mc, rankStr) {
  if(!mc){ document.getElementById('diag-score-area').innerHTML=''; return; }
  const bench = getBench(rankStr);
  const target = getNextBench(bench.key);
  let score=0; const items=[];

  // HS%
  const hsDiff = bench.hs - hsPct;
  if(hsDiff > 4) {
    items.push({sev:'bad',icon:'🎯',key:'HS率',val:`${hsPct}%`,vc:'bad',
      text:`<strong>${bench.label}平均(${bench.hs}%)より${hsDiff}%低い</strong>状態です。初弾を外してスプレー撃ちに逃げる癖があります。まず<strong class="warn">${target.hs}%</strong>を目標に、初弾1発を頭に当てる意識だけに集中してください。`,
      bar:{user:hsPct,bench:bench.hs,target:target.hs,max:40},
      btn:'マイクロフリック練習を見る',focus:'aim-microflick'});
  } else if(hsDiff > 0) {
    items.push({sev:'warn',icon:'🎯',key:'HS率',val:`${hsPct}%`,vc:'warn',
      text:`<strong class="warn">${bench.label}平均まであと${hsDiff}%</strong>。クロスヘアプレイスメントを強化すれば次のランクが見えてきます。`,
      bar:{user:hsPct,bench:bench.hs,target:target.hs,max:40},
      btn:'クロスヘア理論を学ぶ',focus:'aim-crosshair'}); score++;
  } else {
    items.push({sev:'good',icon:'🎯',key:'HS率',val:`${hsPct}%`,vc:'good',text:null}); score+=2;
  }

  // K/D
  if(!isNaN(kd)){
    const kdDiff = (bench.kd - kd).toFixed(2);
    if(kd < bench.kd - 0.15){
      items.push({sev:'bad',icon:'💀',key:'K/D',val:kd.toFixed(2),vc:'bad',
        text:`<strong>${bench.label}平均(${bench.kd})より${kdDiff}低い</strong>です。単独ピークを避け、スキルとのコンボを意識してください。目標: <strong class="warn">${target.kd}</strong>`,
        btn:'ポジショニング理論を見る',focus:'positioning'});
    } else if(kd < bench.kd){
      items.push({sev:'warn',icon:'💀',key:'K/D',val:kd.toFixed(2),vc:'warn',
        text:`<strong class="warn">${bench.label}平均まであと${kdDiff}</strong>。トレードデスを減らすだけで到達できます。`,
        btn:'トレード理論を学ぶ',focus:'trade'}); score++;
    } else {
      items.push({sev:'good',icon:'💀',key:'K/D',val:kd.toFixed(2),vc:'good',text:null}); score+=2;
    }
  }

  // ACS
  if(acs>0){
    const acsDiff = bench.acs - acs;
    if(acsDiff > 25){
      items.push({sev:'bad',icon:'⚡',key:'ACS',val:acs,vc:'bad',
        text:`<strong>${bench.label}平均(${bench.acs})より${acsDiff}低い</strong>です。ダメージ効率を上げましょう。目標: <strong class="warn">${target.acs}</strong>`,
        btn:'インパクト向上の理論を見る',focus:'acs-impact'});
    } else if(acsDiff > 0){
      items.push({sev:'warn',icon:'⚡',key:'ACS',val:acs,vc:'warn',
        text:`<strong class="warn">${bench.label}平均まであと${acsDiff}</strong>。あと少しで次のランクのラインです。`,
        btn:'ACS向上のコツを見る',focus:'acs-impact'}); score++;
    } else {
      items.push({sev:'good',icon:'⚡',key:'ACS',val:acs,vc:'good',text:null}); score+=2;
    }
  }

  // アシスト
  const asDiff = (bench.assists - avgAssists).toFixed(1);
  if(avgAssists < bench.assists - 0.5){
    items.push({sev:'warn',icon:'🤝',key:'アシスト/試合',val:avgAssists,vc:'warn',
      text:`<strong class="warn">${bench.label}平均(${bench.assists})より${asDiff}少ない</strong>です。クロスファイアとスキルサポートを増やしましょう。`,
      btn:'クロスファイア理論を学ぶ',focus:'crossfire'}); score++;
  } else {
    items.push({sev:'good',icon:'🤝',key:'アシスト/試合',val:avgAssists,vc:'good',text:null}); score+=2;
  }

  const pct=Math.round((score/(items.length*2))*100);
  const col=pct>=70?'#22c55e':pct>=40?'#f59e0b':'#FF4655';
  const lbl=pct>=70?'良好':pct>=40?'改善余地あり':'要強化';
  const circ=2*Math.PI*26, offset=circ-(pct/100)*circ;

  document.getElementById('diag-score-area').innerHTML=`
    <div class="diag-score-wrap">
      <div class="diag-score-circle">
        <svg viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="26" stroke="#f0e0e2" stroke-width="6"/>
          <circle cx="32" cy="32" r="26" stroke="${col}" stroke-width="6"
            stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round"/>
        </svg>
        <span class="diag-score-num" style="color:${col}">${pct}</span>
      </div>
      <div>
        <div class="diag-score-sub">コーチングスコア</div>
        <div class="diag-score-label" style="color:${col}">${lbl}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">直近${mc}試合 / 比較: <strong style="color:${col}">${bench.label}</strong>平均</div>
      </div>
    </div>`;

  document.getElementById('diag-items-card').innerHTML=items.map(item=>`
    <div class="diag-item">
      <div class="diag-sev ${item.sev}">${item.icon}</div>
      <div class="diag-content">
        <div class="diag-row"><span class="diag-key">${item.key}</span><span class="diag-val ${item.vc}">${item.val}</span></div>
        ${item.text
          ? `<div class="diag-text">${item.text}</div>
             ${item.bar?benchBar(item.bar):''}
             <a class="diag-btn" href="knowledge.html?focus=${item.focus}">${item.btn} →</a>`
          : `<div class="diag-ok">✓ ${bench.label}平均を上回っています</div>`}
      </div>
    </div>`).join('');
}

function benchBar({user,bench,target,max}){
  const uP=Math.min(100,(user/max)*100);
  const bP=Math.min(100,(bench/max)*100);
  const tP=Math.min(100,(target/max)*100);
  return `<div class="bench-bar"><div class="bench-bar-track"><div class="bench-bar-fill" style="width:${uP}%;background:#FF4655;height:4px;border-radius:100px"></div><div style="position:absolute;top:-4px;bottom:-4px;left:${bP}%;width:2px;background:var(--muted);border-radius:2px"></div><div style="position:absolute;top:-4px;bottom:-4px;left:${tP}%;width:2px;background:var(--green);border-radius:2px"></div></div></div><div style="display:flex;gap:12px;margin-bottom:4px"><span style="font-size:10px;color:var(--muted)">帯平均: <strong>${bench}</strong></span><span style="font-size:10px;color:var(--green)">目標: <strong>${target}</strong></span></div>`;
}

// ========== 詳細試合データ取得（座標用） ==========
async function fetchMatchDetails(matches, name, tag, headers) {
  // ポジションタブに「取得中」表示
  const posNote = document.getElementById('pos-note');
  if(posNote) posNote.textContent = '⏳ 座標データを取得中... (最大30秒)';

  // 直近5試合のmatchIdを取得
  const targets = matches.slice(0, 5);
  const detailMatches = [];

  for(const m of targets) {
    const matchId = m.metadata?.matchid || m.metadata?.['match id'];
    if(!matchId) continue;
    try {
      const res = await henriApi(`valorant/v2/match/${matchId}`);
      if(!res.ok) continue;
      const data = await res.json();
      if(data.data) detailMatches.push(data.data);
    } catch(e) { continue; }
  }

  if(detailMatches.length === 0) {
    if(posNote) posNote.textContent = '※ 座標データが取得できませんでした（APIの制限の可能性があります）';
    return;
  }

  // v2/match の構造で座標を抽出
  _posData = calcPosDataV2(detailMatches, name, tag);
  _currentPhase = 'all';
  buildPosTab(_posData);
}

function calcPosData(matches, name, tag) {
  const maps = {};

  // デバッグ：最初の試合のkillsデータ構造を確認
  if (matches.length > 0) {
    const m0 = matches[0];
    console.log('=== MATCH KEYS ===', Object.keys(m0));
    console.log('=== KILLS SAMPLE ===', m0.kills?.slice(0,2));
    console.log('=== ROUNDS SAMPLE ===', m0.rounds?.slice(0,1));
    console.log('=== PLAYERS KEYS ===', Object.keys(m0.players||{}));
  }

  matches.forEach(match => {
    const mapName = match.metadata?.map || 'Unknown';
    if (!maps[mapName]) maps[mapName]={attack:[],defense:[],isolated:0,total:0};
    const me = findMe(match,name,tag); if(!me) return;
    const myPuuid = me.puuid || me['puuid'];
    const myTeam  = me.team?.toLowerCase();

    // 攻め側チームを特定
    let attackTeamFirstHalf = null;
    const rounds = match.rounds || [];
    for(let i=0;i<Math.min(12,rounds.length);i++){
      if(rounds[i]?.bomb_planted){
        const planterPuuid = rounds[i]?.plant_events?.planted_by?.puuid;
        if(planterPuuid){
          const inBlue = match.players?.blue?.some(p=>p.puuid===planterPuuid);
          attackTeamFirstHalf = inBlue?'blue':'red';
          break;
        }
      }
    }

    (match.kills||[]).forEach(ev=>{
      const victimPuuid = ev['victim puuid'] || ev.victim_puuid;
      const victimName  = (ev['victim display name'] || '').toLowerCase();
      // PUUIDで照合、なければ名前で照合
      const isMyDeath = myPuuid
        ? victimPuuid === myPuuid
        : victimName === name.toLowerCase() || victimName.startsWith(name.toLowerCase()+'#');
      if(!isMyDeath) return;
      const loc = ev['victim death location'] || ev.victim_location;
      if(!loc||loc.x==null) return;
      maps[mapName].total++;

      // フェーズ判定
      const roundNum = ev.round??0;
      const isFirstHalf = roundNum < 12;
      let phase = 'unknown';
      if(attackTeamFirstHalf){
        const myTeamAttackedFirstHalf = myTeam===attackTeamFirstHalf;
        phase = (isFirstHalf===myTeamAttackedFirstHalf)?'attack':'defense';
      }

      maps[mapName][phase==='defense'?'defense':'attack'].push({x:loc.x,y:loc.y,phase});

      // 孤立デス（キー名スペース対応）
      const tms=(ev['player locations on kill']||ev.player_locations_on_kill||[])
        .filter(p=>(p['player puuid']||p.player_puuid)!==myPuuid);
      if(tms.length>0){
        let min=Infinity;
        tms.forEach(t=>{
          const tLoc = t.location;
          if(!tLoc) return;
          const dx=tLoc.x-loc.x, dy=tLoc.y-loc.y;
          min=Math.min(min,Math.sqrt(dx*dx+dy*dy));
        });
        if(min>3500) maps[mapName].isolated++;
      }
    });
  });

  // クラスター計算
  Object.keys(maps).forEach(m=>{
    const g=maps[m];
    const all=[...g.attack,...g.defense];
    if(all.length<3) return;
    g.clusters=clusterPoints(all,2500);
    const top=g.clusters.reduce((a,b)=>a.n>b.n?a:b,{n:0});
    g.fixed=top.n/all.length>=0.4;
    g.fixedRatio=Math.round((top.n/all.length)*100);
    // 攻守別クラスター
    g.attackClusters = g.attack.length>=2?clusterPoints(g.attack,2500):[];
    g.defenseClusters = g.defense.length>=2?clusterPoints(g.defense,2500):[];
  });
  return maps;
}

// v2/match 構造からポジションデータを抽出
function calcPosDataV2(detailMatches, name, tag) {
  const maps = {};
  detailMatches.forEach(match => {
    const mapName = match.metadata?.map || 'Unknown';
    if(!maps[mapName]) maps[mapName]={attack:[],defense:[],kills_pos:[],isolated:0,total:0,engagements:[],deathWeapons:{},roundDetails:[]};

    // v2はplayers.all_playersまたはplayers['all players']
    const allPlayers = match.players?.all_players || match.players?.['all players'] || [];
    const me = allPlayers.find(p =>
      p.name?.toLowerCase()===name.toLowerCase() && p.tag?.toLowerCase()===tag.toLowerCase()
    );
    if(!me) return;
    const myPuuid = me.puuid;
    const myTeam = me.team?.toLowerCase();
    if(!myPuuid) return;

    // 攻め側判定（rounds配列から）
    let attackTeamFirstHalf = null;
    const rounds = match.rounds || [];
    for(let i=0;i<Math.min(12,rounds.length);i++){
      const r = rounds[i];
      if(r?.bomb_planted || r?.['bomb planted']){
        const pe = r.plant_events || r['plant events'] || {};
        const planterPuuid = pe.planted_by?.puuid || pe['planted by']?.puuid;
        if(planterPuuid){
          const inBlue = allPlayers.filter(p=>p.team?.toLowerCase()==='blue').some(p=>p.puuid===planterPuuid);
          attackTeamFirstHalf = inBlue?'blue':'red';
          break;
        }
      }
    }

    // killsを走査（v2はスペース区切りとアンダースコア両対応）
    const kills = match.kills || [];
    kills.forEach(ev=>{
      const victimPuuid = ev['victim puuid'] || ev.victim_puuid;
      const killerPuuid = ev['killer puuid'] || ev.killer_puuid;
      const allLocs = ev['player locations on kill'] || ev.player_locations_on_kill || [];

      // 自分がキルした時の自分の位置を記録
      if(killerPuuid === myPuuid) {
        const myKillEntry = allLocs.find(p=>(p['player puuid']||p.player_puuid)===myPuuid);
        if(myKillEntry?.location) {
          maps[mapName].kills_pos.push({x:myKillEntry.location.x, y:myKillEntry.location.y});
        }
      }

      if(victimPuuid !== myPuuid) return;

      // victim death location が null の場合、player_locations_on_kill の中の自分の位置で代替
      let loc = ev['victim death location'] || ev.victim_location || ev['victim_death_location'];
      if(!loc || (loc.x==null && loc.y==null)) {
        const allLocs = ev['player locations on kill'] || ev.player_locations_on_kill || [];
        const myEntry = allLocs.find(p=>(p['player puuid']||p.player_puuid)===myPuuid);
        loc = myEntry?.location || null;
      }
      if(!loc || loc.x==null) return;

      maps[mapName].total++;
      const roundNum = ev.round ?? 0;
      const isFirstHalf = roundNum < 12;
      let phase = 'unknown';
      if(attackTeamFirstHalf){
        const attacked = myTeam===attackTeamFirstHalf;
        phase = (isFirstHalf===attacked)?'attack':'defense';
      }
      maps[mapName][phase==='defense'?'defense':'attack'].push({x:loc.x,y:loc.y});

      // キラーとの交戦距離を計算
      const killerEntry = allLocs.find(p=>(p['player puuid']||p.player_puuid)===killerPuuid);
      if(killerEntry?.location){
        const kl = killerEntry.location;
        const dist = Math.sqrt((kl.x-loc.x)**2+(kl.y-loc.y)**2);
        maps[mapName].engagements.push({dist, phase});
      }

      // 何の武器で死んだか記録
      const weapon = ev['damage weapon name'] || ev['finishing damage']?.damage_weapon_name || 'Unknown';
      if(weapon && weapon !== 'Unknown') {
        maps[mapName].deathWeapons[weapon] = (maps[mapName].deathWeapons[weapon]||0) + 1;
      }

      // 孤立デス
      const tms = allLocs.filter(p=>(p['player puuid']||p.player_puuid)!==myPuuid);
      if(tms.length>0){
        let min=Infinity;
        tms.forEach(t=>{
          const tl=t.location;
          if(!tl) return;
          const dx=tl.x-loc.x,dy=tl.y-loc.y;
          min=Math.min(min,Math.sqrt(dx*dx+dy*dy));
        });
        if(min>3500) maps[mapName].isolated++;
      }
    });

    // ラウンド別データを抽出
    rounds.forEach((r, roundIdx) => {
      const winTeam = r.winning_team?.toLowerCase() || r['winning team']?.toLowerCase();
      const roundWon = winTeam === myTeam;
      const isFirstHalf2 = roundIdx < 12;
      let phase2 = 'unknown';
      if(attackTeamFirstHalf) {
        const attacked2 = myTeam === attackTeamFirstHalf;
        phase2 = (isFirstHalf2 === attacked2) ? 'attack' : 'defense';
      }

      // このラウンドでの自分のstats（killsはkills配列から直接カウント、damageはplayer_statsから）
      const playerStats = (r.player_stats || r['player stats'] || [])
        .find(ps => (ps.puuid || ps['puuid']) === myPuuid);
      const roundKills = kills.filter(ev =>
        (ev['killer puuid'] || ev.killer_puuid) === myPuuid && (ev.round ?? 0) === roundIdx
      ).length;
      const roundDamage = playerStats?.damage || playerStats?.['damage'] || 0;
      const survived = roundKills >= 0 && !kills.some(ev =>
        (ev['victim puuid'] || ev.victim_puuid) === myPuuid && (ev.round ?? 0) === roundIdx
      );
      const deathInRound = kills.find(ev =>
        (ev['victim puuid'] || ev.victim_puuid) === myPuuid && (ev.round ?? 0) === roundIdx
      );
      const deathWeapon = deathInRound
        ? (deathInRound['damage weapon name'] || deathInRound['finishing damage']?.damage_weapon_name || null)
        : null;

      // 交戦距離（このラウンドでのデス）
      let deathDist = null;
      if(deathInRound) {
        const allLocs3 = deathInRound['player locations on kill'] || deathInRound.player_locations_on_kill || [];
        const myL = allLocs3.find(p=>(p['player puuid']||p.player_puuid)===myPuuid);
        const killerL = allLocs3.find(p=>(p['player puuid']||p.player_puuid)===(deathInRound['killer puuid']||deathInRound.killer_puuid));
        if(myL?.location && killerL?.location) {
          const dx=myL.location.x-killerL.location.x, dy=myL.location.y-killerL.location.y;
          deathDist = Math.sqrt(dx*dx+dy*dy);
        }
      }

      maps[mapName].roundDetails.push({
        roundNum: roundIdx + 1,
        phase: phase2,
        won: roundWon,
        kills: roundKills,
        damage: roundDamage,
        survived,
        deathWeapon,
        deathDist,
        endType: r.end_type || r['end type'] || null,
        bombPlanted: !!(r.bomb_planted || r['bomb planted']),
      });
    });
  });

  // クラスター計算
  Object.keys(maps).forEach(m=>{
    const g=maps[m];
    const all=[...g.attack,...g.defense];
    if(all.length<2) return;
    g.clusters=clusterPoints(all,2500);
    const top=g.clusters.reduce((a,b)=>a.n>b.n?a:b,{n:0});
    if(all.length>0){
      g.fixed=top.n/all.length>=0.4;
      g.fixedRatio=Math.round((top.n/all.length)*100);
    }
    g.attackClusters=g.attack.length>=2?clusterPoints(g.attack,2500):[];
    g.defenseClusters=g.defense.length>=2?clusterPoints(g.defense,2500):[];
  });
  return maps;
}

function clusterPoints(pts,r){
  const used=new Array(pts.length).fill(false),out=[];
  for(let i=0;i<pts.length;i++){
    if(used[i]) continue;
    const g=[pts[i]];used[i]=true;
    for(let j=i+1;j<pts.length;j++){
      if(used[j]) continue;
      const dx=pts[j].x-pts[i].x,dy=pts[j].y-pts[i].y;
      if(Math.sqrt(dx*dx+dy*dy)<=r){g.push(pts[j]);used[j]=true;}
    }
    out.push({x:g.reduce((s,p)=>s+p.x,0)/g.length,y:g.reduce((s,p)=>s+p.y,0)/g.length,n:g.length,pts:g});
  }
  return out;
}

// ========== ポジションタブ構築 ==========
function buildPosTab(data){
  const maps=Object.keys(data).filter(m=>(data[m].attack.length+data[m].defense.length)>0);
  if(!maps.length){
    document.getElementById('pos-loading').style.display='none';
    document.getElementById('pos-content').style.display='block';
    document.getElementById('pos-overview').innerHTML='<p style="text-align:center;color:var(--muted);font-size:13px;padding:20px 0">座標データが取得できませんでした</p>';
    return;
  }

  const totalDead=maps.reduce((s,m)=>s+(data[m].attack.length+data[m].defense.length),0);
  const totalKills=maps.reduce((s,m)=>s+(data[m].kills_pos?.length||0),0);
  const totalIso=maps.reduce((s,m)=>s+data[m].isolated,0);
  const allEngs=maps.flatMap(m=>data[m].engagements||[]);
  const isoPct=totalDead>0?Math.round((totalIso/totalDead)*100):0;

  // 全マップ武器集計
  const allWeapons={};
  maps.forEach(m=>{Object.entries(data[m].deathWeapons||{}).forEach(([w,c])=>{allWeapons[w]=(allWeapons[w]||0)+c;});});
  const topWeapon=Object.entries(allWeapons).sort((a,b)=>b[1]-a[1])[0];

  // 交戦距離集計
  let shortD=0,midD=0,longD=0;
  allEngs.forEach(e=>{if(e.dist<1500)shortD++;else if(e.dist<4500)midD++;else longD++;});
  const engTotal=shortD+midD+longD;

  // オーバービュー
  document.getElementById('pos-overview').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
      <div class="pos-num-card"><div class="pos-num danger">${totalDead}</div><div class="pos-num-label">デス数</div></div>
      <div class="pos-num-card"><div class="pos-num ok">${totalKills}</div><div class="pos-num-label">キル数</div></div>
      <div class="pos-num-card"><div class="pos-num ${isoPct>=40?'danger':isoPct>=20?'warn':'ok'}">${isoPct}%</div><div class="pos-num-label">孤立デス率</div></div>
    </div>

    ${engTotal>=3?`
    <div class="card" style="margin-bottom:10px">
      <div class="card-title">📏 交戦距離の分析</div>
      ${buildRangeBar('近距離 (~15m)', shortD, engTotal, '#ef4444', '接近戦・クリアリング')}
      ${buildRangeBar('中距離 (15-45m)', midD, engTotal, '#f59e0b', 'ライフル距離')}
      ${buildRangeBar('遠距離 (45m~)', longD, engTotal, '#3b82f6', 'スナイパー距離')}
      <div style="font-size:11px;color:var(--muted);margin-top:8px">
        ${shortD>=midD&&shortD>=longD
          ? '⚠️ 近距離での死亡が多い。コーナークリアリングを徹底してください。'
          : midD>=longD
          ? '⚠️ 中距離の正面ピークで負けています。カウンターストレイフとHS率を上げましょう。'
          : '⚠️ 長距離アングルへの露出が多い。スモークで視線を切る意識を持ちましょう。'}
      </div>
    </div>`:``}

    ${topWeapon?`
    <div class="card" style="margin-bottom:10px">
      <div class="card-title">🔫 最もキルされた武器</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="font-size:22px;font-weight:900;color:var(--red)">${topWeapon[0]}</div>
        <div style="font-size:13px;color:var(--muted)">${topWeapon[1]}回 (${Math.round(topWeapon[1]/totalDead*100)}%のデス)</div>
      </div>
    </div>`:``}`;

  // マップ別カード
  document.getElementById('pos-map-cards').innerHTML = maps.map(m=>buildMapCard(m, data[m])).join('');
  document.getElementById('pos-note').style.display='block';
  document.getElementById('pos-loading').style.display='none';
  document.getElementById('pos-content').style.display='block';
}

function buildRangeBar(label, count, total, color, sublabel) {
  const pct = total>0?Math.round(count/total*100):0;
  return `
    <div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="font-size:11px;font-weight:700">${label}</span>
        <span style="font-size:11px;color:var(--muted)">${count}回 (${pct}%)</span>
      </div>
      <div style="height:6px;background:#f0e0e2;border-radius:100px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${color};border-radius:100px;transition:width 0.4s"></div>
      </div>
    </div>`;
}

function buildMapCard(mapName, g) {
  const deathCount = g.attack.length + g.defense.length;
  const killCount  = g.kills_pos?.length || 0;
  const kd = deathCount>0?(killCount/deathCount).toFixed(2):'--';
  const atkPct = deathCount>0?Math.round(g.attack.length/deathCount*100):0;
  const defPct = 100-atkPct;
  const kdColor = parseFloat(kd)>=1?'var(--green)':parseFloat(kd)>=0.7?'var(--yellow)':'var(--red)';

  // 問題点を特定
  const issues=[];
  if(deathCount>=5) {
    if(atkPct>=65) issues.push({cls:'red',icon:'⚔️',text:`攻めで${atkPct}%の死亡 — エントリー方法を見直してください`});
    if(defPct>=65) issues.push({cls:'red',icon:'🛡',text:`守りで${defPct}%の死亡 — ポジションをローテーションしてください`});
    const isoPctM=Math.round((g.isolated/deathCount)*100);
    if(isoPctM>=40) issues.push({cls:'yellow',icon:'⚠️',text:`孤立デス${isoPctM}% — 単独ピークが多い`});
    const atkTop=g.attackClusters?.[0];
    if(g.attack.length>=5&&atkTop&&atkTop.n/g.attack.length>=0.60)
      issues.push({cls:'red',icon:'🚫',text:`攻め固定化 ${Math.round(atkTop.n/g.attack.length*100)}%が同地点 — 別ルートを使ってください`});
    const defTop=g.defenseClusters?.[0];
    if(g.defense.length>=5&&defTop&&defTop.n/g.defense.length>=0.60)
      issues.push({cls:'red',icon:'📌',text:`守り固定化 ${Math.round(defTop.n/g.defense.length*100)}%が同地点 — 敵に読まれています`});
  }
  if(!issues.length&&deathCount>=3) issues.push({cls:'green',icon:'✅',text:'このマップでは大きな問題なし'});

  const topWeapon = Object.entries(g.deathWeapons||{}).sort((a,b)=>b[1]-a[1])[0];

  return `
  <div class="card" style="margin-bottom:10px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:14px;font-weight:800">${mapName}</div>
      <button onclick="openDetail('${mapName.replace(/'/g,"\\'")}')" style="font-size:11px;font-weight:700;color:var(--red);background:var(--red-light);border:1px solid #ffd0d5;border-radius:100px;padding:4px 12px;cursor:pointer;font-family:inherit">詳細 →</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">${deathCount}デス / ${killCount}キル</div>

    <!-- K/D と攻守バー -->
    <div style="display:flex;gap:10px;margin-bottom:10px">
      <div style="text-align:center;flex:1;background:#f8f8f8;border-radius:10px;padding:10px">
        <div style="font-size:20px;font-weight:900;color:${kdColor}">${kd}</div>
        <div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase">K/D</div>
      </div>
      <div style="flex:2;background:#f8f8f8;border-radius:10px;padding:10px">
        <div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:5px">攻め / 守り デス比</div>
        <div style="height:8px;background:#e2e8f0;border-radius:100px;overflow:hidden;display:flex">
          <div style="width:${atkPct}%;background:#FF4655;border-radius:100px 0 0 100px"></div>
          <div style="width:${defPct}%;background:#3b82f6;border-radius:0 100px 100px 0"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:3px">
          <span style="font-size:10px;color:#FF4655;font-weight:700">⚔ ${atkPct}%</span>
          <span style="font-size:10px;color:#3b82f6;font-weight:700">${defPct}% 🛡</span>
        </div>
      </div>
    </div>

    ${topWeapon?`<div style="font-size:11px;color:var(--muted);margin-bottom:8px">最多キル武器: <strong style="color:var(--text)">${topWeapon[0]}</strong> (${topWeapon[1]}回)</div>`:''}

    ${issues.map(i=>`
      <div style="display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:10px;margin-bottom:6px;background:${i.cls==='red'?'rgba(255,70,85,0.07)':i.cls==='yellow'?'rgba(245,158,11,0.07)':'rgba(34,197,94,0.07)'}">
        <span style="font-size:14px;flex-shrink:0">${i.icon}</span>
        <span style="font-size:11px;font-weight:600;color:var(--text)">${i.text}</span>
      </div>`).join('')}
  </div>`;
}

// ============================================================
// AI分析：交戦距離・攻守比・固定化・孤立を言語化
// ============================================================
function buildAiAnalysis(data, maps, allEngs, isoPct, fixedMaps) {
  const insights = [];

  // 1. 交戦距離分析
  if(allEngs.length >= 3) {
    const short  = allEngs.filter(e=>e.dist < 1500).length; // ~15m
    const mid    = allEngs.filter(e=>e.dist>=1500&&e.dist<4500).length; // ~15-45m
    const long   = allEngs.filter(e=>e.dist>=4500).length; // ~45m+
    const total  = allEngs.length;
    const shortP = Math.round(short/total*100);
    const midP   = Math.round(mid/total*100);
    const longP  = Math.round(long/total*100);
    const weakRange = shortP>=midP&&shortP>=longP?'近距離':midP>=longP?'中距離':'遠距離';
    const weakPct   = Math.max(shortP,midP,longP);

    const rangeAdvice = {
      '近距離': 'クリアリングが甘く、近距離で奇襲されています。コーナーを素早くクリアする練習（Kovaak\'sのClose Range）を増やしてください。',
      '中距離': '中距離での正面ピーク勝負で負けています。クロスヘアプレイスメントとカウンターストレイフを改善しましょう。',
      '遠距離': '遠距離での撃ち合いで死んでいます。長射程アングルへの露出を減らし、スモークで視線を切ることを意識してください。',
    };
    insights.push({
      cls:'red', icon:'📏',
      title:`${weakRange}での死亡が${weakPct}%と最多`,
      desc:`近距離 ${shortP}% / 中距離 ${midP}% / 遠距離 ${longP}%。${rangeAdvice[weakRange]}`
    });
  }

  // 2. 攻め/守りのバランス分析
  maps.forEach(m=>{
    const g = data[m];
    const atkD = g.attack.length, defD = g.defense.length;
    const tot = atkD + defD;
    if(tot < 4) return;
    const atkPct = Math.round(atkD/tot*100);
    const defPct = Math.round(defD/tot*100);
    if(atkPct >= 65) {
      insights.push({cls:'red',icon:'⚔️',
        title:`${m}: 攻めで${atkPct}%の死亡`,
        desc:`攻めのエントリーで圧倒的に死んでいます。無策なフラッシュなしピークを避け、スキルでオーバーロードしてからエントリーしましょう。`
      });
    } else if(defPct >= 65) {
      insights.push({cls:'red',icon:'🛡',
        title:`${m}: 守りで${defPct}%の死亡`,
        desc:`守りのポジションが読まれているか、アグレッシブすぎます。守りのポジションを毎ラウンド変えましょう。`
      });
    }
  });

  // 3. 固定化・孤立（データ数が少ない場合は判定しない）
  maps.forEach(m=>{
    const g=data[m];
    const all=[...g.attack,...g.defense];
    if(all.length<5) return; // データ少なすぎは判定しない

    const isoPctM=Math.round((g.isolated/all.length)*100);

    // 攻め固定化：5回以上死んでいて60%以上が同クラスター
    const atkTop=g.attackClusters?.[0];
    const atkFixed=g.attack.length>=5&&atkTop&&(atkTop.n/g.attack.length)>=0.60;

    // 守り固定化：5回以上死んでいて60%以上が同クラスター
    const defTop=g.defenseClusters?.[0];
    const defFixed=g.defense.length>=5&&defTop&&(defTop.n/g.defense.length)>=0.60;

    if(atkFixed) insights.push({cls:'red',icon:'🚫',
      title:`${m}: 攻めのエントリーが固定 (${Math.round(atkTop.n/g.attack.length*100)}%が同地点)`,
      desc:`毎ラウンド同じ場所から突っ込んで止められています。別ルートや別タイミングを意識してください。`
    });
    if(defFixed) insights.push({cls:'red',icon:'📌',
      title:`${m}: 守りのポジションが固定 (${Math.round(defTop.n/g.defense.length*100)}%が同地点)`,
      desc:`毎ラウンド同じポジションで守っています。敵に完全に読まれているサインです。ラウンドごとにローテーションしてください。`
    });
    if(isoPctM>=40) insights.push({cls:'yellow',icon:'⚠️',
      title:`${m}: 孤立デスが${isoPctM}%`,
      desc:`味方のカバーが届かない位置で${g.isolated}回死んでいます。ピーク前に味方のロケーションを確認しましょう。`
    });
  });

  if(!insights.length) {
    insights.push({cls:'green',icon:'✅',title:'大きな問題なし',desc:'交戦距離・攻守バランス・ポジションのいずれも許容範囲内です。'});
  }

  return `<div style="margin-top:2px">
    ${insights.map(x=>`
      <div class="pos-insight ${x.cls}" style="margin-bottom:8px">
        <div class="pos-insight-icon">${x.icon}</div>
        <div>
          <div class="pos-insight-title">${x.title}</div>
          <div class="pos-insight-desc">${x.desc}</div>
        </div>
      </div>`).join('')}
  </div>`;
}

function redrawCurrent(){

  const clusters=_currentPhase==='attack'?g.attackClusters:_currentPhase==='defense'?g.defenseClusters:g.clusters;
  drawHeatmap(`canvas-${sid(_currentMap)}`, deaths, clusters||[], _currentPhase, allDeaths);

// ========== ヒートマップ描画 ==========
function renderHeatmaps(data, phase){
  Object.keys(data).forEach(m=>{
    const g=data[m];
    const allDeaths=[...g.attack,...g.defense];
    if(!allDeaths.length) return;
    drawHeatmap(`canvas-${sid(m)}`, allDeaths, g.clusters||[], 'all', allDeaths);
  });
}

function drawHeatmap(canvasId, deaths, clusters, phase, allDeaths){
  const canvas=document.getElementById(canvasId); if(!canvas) return;
  const ctx=canvas.getContext('2d'), W=canvas.width, H=canvas.height;

  const mapName = canvasId.replace('canvas-','').replace(/_/g,' ');
  const md = _mapData[mapName];

  const dotCol  = phase==='defense'?'#3b82f6':'#FF4655';
  const glowCol = phase==='defense'?'rgba(59,130,246,':'rgba(255,70,85,';

  // ============================================================
  // 座標変換：valorant-api.com の変換式を優先、次にmin-max
  // ============================================================
  const base = (allDeaths && allDeaths.length) ? allDeaths : deaths;

  // valorant-api.com 変換を全座標に適用して有効範囲を確認
  let useApiTransform = false;
  let _tc;

  if(md && md.xMul) {
    const uvs = base.map(d=>({
      u: d.x * md.xMul + md.xAdd,
      v: d.y * md.yMul + md.yAdd
    }));
    const inRange = uvs.filter(p=>p.u>=0&&p.u<=1&&p.v>=0&&p.v<=1).length;
    // 50%以上のポイントが[0,1]内ならAPI変換を使用
    if(inRange / uvs.length >= 0.5) {
      useApiTransform = true;
      _tc = (x,y) => [
        (x * md.xMul + md.xAdd) * W,
        (y * md.yMul + md.yAdd) * H
      ];
    }
  }

  if(!useApiTransform) {
    // フォールバック：全フェーズ共通のmin-max正規化
    const xs=base.map(d=>d.x), ys=base.map(d=>d.y);
    const minX=Math.min(...xs),maxX=Math.max(...xs);
    const minY=Math.min(...ys),maxY=Math.max(...ys);
    const pad=20;
    _tc = (x,y) => [
      maxX>minX ? pad+((x-minX)/(maxX-minX))*(W-2*pad) : W/2,
      maxY>minY ? pad+((y-minY)/(maxY-minY))*(H-2*pad) : H/2
    ];
  }

  function renderDots() {
    if(!deaths.length){
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.font='13px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('このフェーズのデータなし',W/2,H/2);
      return;
    }
    // ヒートグロー
    deaths.forEach(d=>{
      const [cx,cy]=_tc(d.x,d.y);
      const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,26);
      gr.addColorStop(0,glowCol+'0.55)');
      gr.addColorStop(1,glowCol+'0)');
      ctx.beginPath();ctx.arc(cx,cy,26,0,Math.PI*2);
      ctx.fillStyle=gr;ctx.fill();
    });
    // クラスター強調（黄色）
    (clusters||[]).filter(c=>c.n>=2).forEach(c=>{
      const [cx,cy]=_tc(c.x,c.y);
      const r=14+c.n*5;
      const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      gr.addColorStop(0,`rgba(245,158,11,${Math.min(0.75,0.25+c.n*0.08)})`);
      gr.addColorStop(1,'rgba(245,158,11,0)');
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle=gr;ctx.fill();
      ctx.fillStyle='#f59e0b';
      ctx.font=`bold ${12+c.n}px sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(`×${c.n}`,cx,cy);
    });
    // ドット
    deaths.forEach(d=>{
      const [cx,cy]=_tc(d.x,d.y);
      ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);
      ctx.fillStyle=dotCol;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.9)';
      ctx.lineWidth=1.5;ctx.stroke();
    });
  }

  // 背景描画してからドット描画
  function drawWithBg(drawFn) {
    ctx.fillStyle='#0d1117';
    ctx.fillRect(0,0,W,H);
    drawFn();
    renderDots();
  }

  if(md?.img) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => drawWithBg(()=>{
      ctx.globalAlpha = 0.6;
      ctx.drawImage(img,0,0,W,H);
      ctx.globalAlpha = 1.0;
    });
    img.onerror = () => drawWithBg(()=>{});
    img.src = md.img;
  } else {
    drawWithBg(()=>{
      ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
      for(let i=0;i<=8;i++){
        ctx.beginPath();ctx.moveTo(i*(W/8),0);ctx.lineTo(i*(W/8),H);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,i*(H/8));ctx.lineTo(W,i*(H/8));ctx.stroke();
      }
      ctx.fillStyle='rgba(255,255,255,0.04)';ctx.font='bold 36px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(mapName.toUpperCase(),W/2,H/2);
    });
  }
}

let _detailMap = '';
let _detailPhase = 'all';

function openDetail(mapName) {
  _detailMap = mapName;
  _detailPhase = 'all';
  document.querySelectorAll('.detail-phase-btn').forEach((b,i)=>{
    b.style.background = i===0?'white':'none';
    b.style.color = i===0?'var(--text)':'rgba(255,255,255,0.6)';

function closeDetail() {

  document.body.style.overflow = '';
}

function switchDetailPhase(phase, btn) {
  _detailPhase = phase;
  document.querySelectorAll('.detail-phase-btn').forEach(b=>{
    const isActive = b === btn;

function renderDetail() {
  if(!_posData||!_detailMap) return;
  const g = _posData[_detailMap];
  if(!g) return;

  const rounds = (g.roundDetails || []).filter(r =>
    _detailPhase === 'all' || r.phase === _detailPhase
  );

  // サマリー（フェーズ別）
  const wins   = rounds.filter(r=>r.won).length;
  const losses = rounds.length - wins;
  const totalK = rounds.reduce((s,r)=>s+r.kills,0);
  const totalD = rounds.filter(r=>!r.survived).length;
  const totalDmg = rounds.reduce((s,r)=>s+r.damage,0);
  const winRate = rounds.length>0?Math.round(wins/rounds.length*100):0;
  const avgDmg  = rounds.length>0?Math.round(totalDmg/rounds.length):0;

  // フェーズ別アドバイス
  const phaseAdvice = genPhaseAdvice(rounds, _detailPhase);

  document.getElementById('detail-summary').innerHTML = `
    <div style="background:white;border:1.5px solid var(--border);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:var(--card-shadow)">
      <div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px">
        ${_detailPhase==='all'?'全ラウンド':_detailPhase==='attack'?'⚔ 攻めラウンド':'🛡 守りラウンド'}のまとめ
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px">
        <div style="text-align:center">
          <div style="font-size:18px;font-weight:900;color:${winRate>=50?'var(--green)':'var(--red)'}">${winRate}%</div>
          <div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">勝率</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:18px;font-weight:900">${totalK}/${totalD}</div>
          <div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">K/D</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:18px;font-weight:900">${avgDmg}</div>
          <div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">平均DMG</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:18px;font-weight:900">${rounds.length}</div>
          <div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">ラウンド数</div>
        </div>
      </div>
      ${phaseAdvice.map(a=>`
        <div style="display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin-bottom:6px;background:${a.cls==='red'?'rgba(255,70,85,0.07)':a.cls==='yellow'?'rgba(245,158,11,0.07)':'rgba(34,197,94,0.07)'}">
          <span style="font-size:15px;flex-shrink:0">${a.icon}</span>
          <div>
            <div style="font-size:12px;font-weight:700;margin-bottom:2px">${a.title}</div>
            <div style="font-size:11px;color:var(--muted);line-height:1.5">${a.desc}</div>
          </div>
        </div>`).join('')}
    </div>`;

  // ラウンドリスト
  document.getElementById('detail-rounds').innerHTML = `
    <div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;padding-left:4px">ラウンド詳細</div>
    ${rounds.map(r=>buildRoundCard(r)).join('')}`;
}

function genPhaseAdvice(rounds, phase) {
  if(rounds.length < 3) return [{cls:'yellow',icon:'📊',title:'データ不足',desc:'もう少し試合数が増えると精度が上がります。'}];
  const advice = [];
  const deathRounds = rounds.filter(r=>!r.survived);
  const survRounds  = rounds.filter(r=>r.survived);
  const zeroKillDeaths = deathRounds.filter(r=>r.kills===0).length;
  const highDmgDeaths  = deathRounds.filter(r=>r.damage>=150&&r.kills===0).length;
  const earlyDeaths = deathRounds.filter(r=>r.kills===0&&r.damage<80).length;
  const multiKillRounds = rounds.filter(r=>r.kills>=2).length;
  const wins = rounds.filter(r=>r.won).length;
  const winRate = Math.round(wins/rounds.length*100);

  if(winRate < 45) {
    if(phase==='attack') advice.push({cls:'red',icon:'⚔️',title:'攻めの勝率が低い',desc:'エントリーの成功率を上げる必要があります。スキルで視線を切ってからエントリーする意識を持ちましょう。'});
    else if(phase==='defense') advice.push({cls:'red',icon:'🛡',title:'守りの勝率が低い',desc:'アグレッシブすぎるか、ポジションが読まれています。遅延守備を意識してください。'});
    else advice.push({cls:'red',icon:'📉',title:`勝率${winRate}%`,desc:'全体的に勝率が低い状態です。個人パフォーマンスよりチームとの連携を優先しましょう。'});
  } else {
    advice.push({cls:'green',icon:'✅',title:`勝率${winRate}%`,desc:phase==='attack'?'攻めのラウンドは安定しています。':'守りのラウンドは安定しています。'});
  }

  const earlyRoundsCount = deathRounds.filter(r=>r.kills===0&&r.damage<80).length;
  if(earlyRoundsCount > 0 && deathRounds.length >= 3) {
    const earlyPct = Math.round(earlyRoundsCount/deathRounds.length*100);
    if(earlyPct >= 40) advice.push({cls:'red',icon:'💀',title:`早期デスが${earlyPct}%`,desc:'ラウンド開始直後に貢献できずに死んでいます。ピークのタイミングを遅らせ、味方の動きを見てから動きましょう。'});
  }

  if(highDmgDeaths >= 2) advice.push({cls:'yellow',icon:'🔫',title:`150+DMGで${highDmgDeaths}回トレードデス`,desc:'ダメージは与えられているのにキルが取れていません。HS率を上げることで勝ちデュエルに変えられます。'});
  if(multiKillRounds >= 2) advice.push({cls:'green',icon:'🎯',title:`${multiKillRounds}ラウンドでマルチキル`,desc:'マルチキルが取れているラウンドがあります。そのラウンドの動きを意識して再現しましょう。'});
  if(survRounds.length >= 3 && survRounds.filter(r=>r.kills===0).length/survRounds.length > 0.5)
    advice.push({cls:'yellow',icon:'👣',title:'サバイブ多いがキル貢献が少ない',desc:'生き残ることは大事ですが、もっと積極的に交戦することでラウンドへの貢献を増やせます。'});

  return advice.length ? advice : [{cls:'green',icon:'✅',title:'問題なし',desc:'このフェーズのパターンは良好です。'}];
}

function buildRoundCard(r) {
  const resultColor = r.won ? 'var(--green)' : 'var(--red)';
  const resultLabel = r.won ? 'WIN' : 'LOSS';
  const phaseLabel  = r.phase==='attack'?'⚔':r.phase==='defense'?'🛡':'?';
  const survived    = r.survived ? '🟢 生存' : '🔴 デス';
  const rangeLabel  = r.deathDist!=null ? (r.deathDist<1500?'近距離':r.deathDist<4500?'中距離':'遠距離') : null;

  const advice = genRoundAdvice(r);

  return `
  <div style="background:white;border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--card-shadow)">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="width:38px;height:38px;border-radius:10px;background:${r.won?'rgba(34,197,94,0.1)':'rgba(255,70,85,0.1)'};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:${resultColor};flex-shrink:0">${resultLabel}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:800">R${r.roundNum} <span style="font-weight:400;color:var(--muted);font-size:12px">${phaseLabel} ${r.phase==='attack'?'攻め':r.phase==='defense'?'守り':'---'}</span></div>
        <div style="font-size:11px;color:var(--muted)">${survived}${r.deathWeapon?' · '+r.deathWeapon:''}${rangeLabel?' · '+rangeLabel:''}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:13px;font-weight:900">${r.kills}K</div>
        <div style="font-size:11px;color:var(--muted)">${r.damage}dmg</div>
      </div>
    </div>
    ${advice?`<div style="background:#f8f8f8;border-radius:10px;padding:8px 10px;font-size:11px;color:var(--text);line-height:1.55">💡 ${advice}</div>`:''}
  </div>`;
}

function genRoundAdvice(r) {
  const atk = r.phase === 'attack';
  const def = r.phase === 'defense';
  const dist = r.deathDist;
  const dmg = r.damage;
  const k = r.kills;
  const wp = r.deathWeapon;
  const planted = r.bombPlanted;
  const endType = r.endType; // 'Eliminated' / 'Bomb defused' / 'Bomb detonated' etc.

  // ============ 生存ラウンド ============
  if(r.survived) {
    if(k >= 5) return `エース。この試合一番のラウンド。プレッシャーをかけ続けた結果が出た。`;
    if(k === 4) return `4キル生存。圧倒的なラウンド。このテンポ感をチームに持ち込めると試合が動く。`;
    if(k === 3) return `3キル生存。十分すぎる貢献。${atk?'ここまで取れるならプラントまで持っていけたはず。':def?'守りとしては理想的。このポジション選択は正しかった。':''}`;
    if(k === 2) return `2キル生存。悪くない。${dmg>=200?'ダメージも高い。交戦の質が上がってる。':'次は3キル目を取れるポジションを意識してみて。'}`;
    if(k === 1 && dmg >= 150) return `1キル生存だが${dmg}ダメージ。もう1発当たってればキルが取れた。フィニッシュまで追い切る判断が課題。`;
    if(k === 1) return null; // 1キル生存は普通、コメント不要
    if(k === 0 && dmg >= 150) return `キルは取れなかったが${dmg}ダメージ。その相手は次のラウンドで買い物できないか安いガンで来る。ダメージトレードとして悪くない。`;
    if(k === 0 && dmg >= 80) return `キルなし・${dmg}ダメージで生存。${atk?'もう少し前に出れれば取れたはず。ポジションが引きすぎかも。':def?'相手を傷つけながら引いた。悪くないけど前半でもっと削れると後半楽になる。':''}`;
    if(k === 0 && dmg < 30) {
      if(atk) return `ほぼ何もせず生存。攻めで貢献ゼロは痛い。情報取りや囮として動く意識を持つか、もっと前に出てデュエルを作るべきラウンドだった。`;
      if(def) return `ダメージも入れずに守り切れたなら、相手が来なかったか完全に引いた守備。それはそれでOKだが、もっと積極的にプレッシャーをかけられるポジションも検討して。`;
    }
    return null;
  }

  // ============ デスしたラウンド ============
  if(!r.survived) {
    // 高キルからのデス
    if(k >= 3) return `${k}キル取ってからのデス。ここまで取れたなら、最後は無理をせず味方に任せてもよかった。ピークの欲が出た。`;
    if(k === 2) {
      if(atk && planted) return `2キル＋プラント後のデス。役割は果たしてる。あとは味方がクローズアウトできるかどうか。`;
      return `2キル取ってのデス。悪くないトレード。${dist!=null&&dist<1500?'ただ近距離で詰められてるのが続くならポジション見直しが必要。':''}`;
    }
    if(k === 1) {
      if(dist!=null && dist<1500) return `1キルトレードで近距離デス。取っては取られての繰り返しは試合を動かせない。コーナーのクリアリングを丁寧にやるか、先にフラッシュを投げてから動いて。`;
      return `1キル取ってデス。イーブントレード。${atk?'攻めでこれが続くとサイトを取れない。スキルで有利を作ってからエントリーする流れを意識して。':def?'守りでイーブントレードは不利。数的不利になってプラントを許しやすくなる。もう一歩引いた守備でもよかったかも。':''}`;
    }

    // キルなし・ダメージ大
    if(k === 0 && dmg >= 150) {
      const wpStr = wp ? `（${wp}に）` : '';
      return `キルなし・${dmg}ダメージでデス${wpStr}。デュエルには勝ちかけていた。HSが1発決まっていれば逆転できた交戦。クロスヘアプレイスメントと初弾精度が鍵。`;
    }
    if(k === 0 && dmg >= 80) {
      if(dist!=null && dist<1500) return `近距離で${dmg}ダメージ与えながら負けた。クリアリングの順番か、覗くタイミングが悪い。相手に先にエイムを合わせられている。`;
      if(dist!=null && dist>4500) return `遠距離で${dmg}ダメージ与えながら負けた。長射程のデュエルは確率が低い。スモークで視線を切るかルートを変えることで消耗を減らせる。`;
      return `${dmg}ダメージ与えながらキルが取れずデス。フィニッシュまで追い切れていない。デュエル中に立ち止まる時間が長すぎるか、一歩踏み込みが足りない。`;
    }

    // キルなし・ダメージ小
    if(k === 0 && dmg < 30) {
      if(dist!=null && dist<1500) return `近距離でほぼ交戦できずにやられた。コーナーから出た瞬間に撃たれている可能性が高い。クリアリングを1か所ずつ丁寧にやること。`;
      if(dist!=null && dist>4500) {
        if(atk) return `遠距離から一方的に抜かれた。攻めでオープンなエリアを歩いてスナイパーに抜かれるのは最悪のデス。スモークかダッシュを使って視線を切って。`;
        if(def) return `遠距離からほぼノーダメで負けた。守りのポジションが長射程に対して丸見えになっている。もう少し引いたアングルか、詰める選択肢も考えて。`;
      }
      if(atk) {
        if(planted) return `プラント後にキルもダメージも出せずにデス。リテイク時の動線に問題がある。爆弾を守る側のポジション選択を事前に決めておいて。`;
        return `攻めで何も出来ずにデス。情報もダメージも出せていない。エントリーか情報取り、どちらかの役割を明確にしてラウンドに入ること。`;
      }
      if(def) return `守りでほぼ何もできずにデス。アグレッシブに前に出て抜かれたか、ポジションが丸見えになっている。${wp?`${wp}でやられているなら、そのアングルは相手に読まれてる。`:''}ポジションを変えることを検討して。`;
      return `ほぼ何も出来ずにデス。このラウンドは動き出しの判断から見直す必要がある。`;
    }

    // デス距離だけで判断
    if(dist!=null) {
      if(dist<1500) return `近距離でやられた。コーナーを素通りするクセがあるかも。クリアリングを丁寧にやるか、先にフラッシュを投げてから動いて。`;
      if(dist>4500) return `長射程アングルに晒されてデス。そのルートはスナイパーに狙われやすい。スモークで視線を消すか、別ルートを使う選択をして。`;
    }

    return null;
  }

  return null;
}
